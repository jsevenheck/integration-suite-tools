name: build

# Pushes run only for main and v* tags, so a push to main does not also run again for an open pull request.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  engine-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-26]
    runs-on: ${{ matrix.os }}
    defaults:
      run: { shell: bash }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "17", cache: maven }
      - name: Unit tests (both Saxon and both Groovy engines)
        run: mvn -B -f engine/pom.xml verify
      - name: Workload on the JVM engines
        run: |
          python3 engine/native/workload.py java -jar engine/xml-he99/target/cpiwb-xml-he99.jar serve --stdio
          python3 engine/native/workload.py java -jar engine/xml-he12/target/cpiwb-xml-he12.jar serve --stdio
      - name: Regression test cases
        run: |
          java -jar engine/xml-he99/target/cpiwb-xml-he99.jar test testdata/regression-project/tests
          java -jar engine/groovy-v1/target/cpiwb-groovy-v1.jar test testdata/regression-project/tests
          java -jar engine/groovy-v2/target/cpiwb-groovy-v2.jar test testdata/regression-project/tests
      # The engine jars run on any Java 17+ (command line, CI pipelines); a release attaches them.
      - if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: engine-jars
          path: |
            engine/xml-he99/target/cpiwb-xml-he99.jar
            engine/xml-he12/target/cpiwb-xml-he12.jar
            engine/groovy-v1/target/cpiwb-groovy-v1.jar
            engine/groovy-v2/target/cpiwb-groovy-v2.jar
          # Only the release job of the same run needs them; the release keeps its own copies.
          retention-days: 3
          if-no-files-found: error

  desktop:
    needs: engine-tests
    strategy:
      fail-fast: false
      matrix:
        # macos-26 is Apple Silicon (Intel runners are no longer reliably available).
        # ubuntu-22.04 on purpose: Linux binaries need at least the glibc they were built
        # against, so the oldest supported runner keeps the packages usable on more distributions.
        os: [windows-latest, macos-26, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    env:
      # Without it, clang targets the runner's macOS version and the app would not start on older
      # Macs. Matches bundle.macOS.minimumSystemVersion in tauri.conf.json. native-image does not
      # pass it on to its linker, so the native engines get it as a linker option below.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        id: jdk17
        with: { distribution: temurin, java-version: "17" }
      - name: Java runtime for the Groovy engines (jlink, Java 17 like CPI)
        shell: bash
        run: JAVA_HOME="${{ steps.jdk17.outputs.path }}" engine/groovy/build-jre.sh "$RUNNER_TEMP/jre"
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: "21"
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - name: Build engine jars
        run: mvn -B -f engine/pom.xml -DskipTests package
      - name: Build native engines
        shell: bash
        run: |
          mkdir -p engine/native/out
          ni=native-image; [ "$RUNNER_OS" = "Windows" ] && ni=native-image.cmd
          opts=(); [ "$RUNNER_OS" = "macOS" ] && opts=("-H:NativeLinkerOption=-mmacosx-version-min=$MACOSX_DEPLOYMENT_TARGET")
          for id in he99 he12; do
            "$ni" --no-fallback -march=compatibility "${opts[@]}" -jar engine/xml-$id/target/cpiwb-xml-$id.jar -o engine/native/out/cpiwb-xml-$id
          done
      - name: Smoke-test native engines
        shell: bash
        run: |
          ext=""; [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          python3 engine/native/workload.py engine/native/out/cpiwb-xml-he99$ext serve --stdio
          python3 engine/native/workload.py engine/native/out/cpiwb-xml-he12$ext serve --stdio
      - name: Native engines start on macOS 11 (minos)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          for id in he99 he12; do
            minos=$(otool -l engine/native/out/cpiwb-xml-$id | awk '/LC_BUILD_VERSION/{f=1} f&&/minos/{print $2; exit}')
            echo "cpiwb-xml-$id: minos $minos"
            [ "${minos%%.*}" -le 11 ] || { echo "::error::cpiwb-xml-$id needs macOS $minos, the app promises 11.0"; exit 1; }
          done
      - uses: actions/setup-node@v7
        with: { node-version: "22", cache: npm, cache-dependency-path: app/package-lock.json }
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install UI dependencies
        working-directory: app
        run: npm ci
      - name: Type-check UI
        working-directory: app
        run: npm run check
      - name: UI unit tests (formatters)
        working-directory: app
        run: npm test
      - name: Stage sidecars
        working-directory: app
        env:
          CPIWB_JRE_DIR: ${{ runner.temp }}/jre
        run: node scripts/prepare-sidecars.mjs
      # The shell's own path to the engines (stdio, native executables, bundled JRE) on this OS.
      - name: Shell tests against the bundled engines
        working-directory: app
        env:
          CPIWB_REQUIRE_ENGINES: "1"
          JAVA_HOME: ${{ runner.temp }}/jre
        run: |
          npm run build
          cargo test --manifest-path src-tauri/Cargo.toml
      # Default shell (pwsh on Windows): in Git bash, /usr/bin/link shadows MSVC's link.exe.
      - name: Bundle desktop app
        working-directory: app
        env:
          CPIWB_JRE_DIR: ${{ runner.temp }}/jre
        run: |
          npx tauri build ${{ runner.os == 'Linux' && '--bundles deb,rpm' || '' }}
      - uses: actions/upload-artifact@v7
        with:
          name: cpi-workbench-${{ matrix.os }}
          path: |
            app/src-tauri/target/release/bundle/**/*.msi
            app/src-tauri/target/release/bundle/**/*.exe
            app/src-tauri/target/release/bundle/**/*.dmg
            app/src-tauri/target/release/bundle/**/*.rpm
            app/src-tauri/target/release/bundle/**/*.deb
          if-no-files-found: warn
          # Branch builds are for a quick test; a release keeps its installers as release assets too.
          retention-days: ${{ startsWith(github.ref, 'refs/tags/v') && 90 || 3 }}

  ui-e2e:
    needs: engine-tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run: { shell: bash }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "17", cache: maven }
      - uses: actions/setup-node@v7
        with: { node-version: "22", cache: npm, cache-dependency-path: app/package-lock.json }
      - run: mvn -B -f engine/pom.xml -DskipTests package
      - working-directory: app
        run: npm ci && npm run build && npm install --no-save playwright && npx playwright install --with-deps chromium
      - name: Browser tests (web mode, XSLT + Groovy engines)
        run: |
          java -jar engine/xml-he99/target/cpiwb-xml-he99.jar serve --http 7777 --ui app/dist &
          java -jar engine/groovy-v1/target/cpiwb-groovy-v1.jar serve --http 7778 &
          java -jar engine/groovy-v2/target/cpiwb-groovy-v2.jar serve --http 7779 &
          java -jar engine/xml-he12/target/cpiwb-xml-he12.jar serve --http 7780 &
          for port in 7777 7778 7779 7780; do
            for i in $(seq 60); do curl -s -o /dev/null "http://127.0.0.1:$port/" && break; sleep 1; done
          done
          # Forward slashes work for bash, Node and Java alike (cygpath exists only on Windows).
          tmp="$RUNNER_TEMP"; command -v cygpath >/dev/null && tmp="$(cygpath -m "$tmp")"
          demo="$tmp/demo-project"
          cp -r testdata/regression-project "$demo"
          node app/e2e/smoke.mjs "$demo"
          rm -rf "$demo" && cp -r testdata/regression-project "$demo"
          # The iFlow fixture as an exported zip: groovy.mjs imports it and opens its steps.
          jar --create --no-manifest --file "$tmp/iflow.zip" -C engine/core/src/test/resources/iflow .
          CPIWB_IFLOW_ZIP="$tmp/iflow.zip" node app/e2e/groovy.mjs "$demo"

  # A pushed tag v<version> publishes a GitHub release with the installers and engine jars, once
  # every build and test job is green. The tag must match the app version (app/scripts/set-version.mjs).
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [engine-tests, desktop, ui-e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches the app and engine versions
        run: |
          version="${GITHUB_REF_NAME#v}"
          app="$(node -p "require('./app/src-tauri/tauri.conf.json').version")"
          if [ "$version" != "$app" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the app version $app (run app/scripts/set-version.mjs)"
            exit 1
          fi
          for f in engine/xml/src/main/java/io/cpiwb/xml/XmlEngine.java engine/groovy/src/main/java/io/cpiwb/groovy/GroovyEngine.java; do
            if ! grep -q "String VERSION = \"$version\";" "$f"; then
              echo "::error::$f does not have VERSION $version (run app/scripts/set-version.mjs)"
              exit 1
            fi
          done
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          path: downloaded
      - name: Collect assets
        run: |
          mkdir assets
          # Spaces become dashes: "CPI Workbench_0.1.0_x64-setup.exe" -> "CPI-Workbench_0.1.0_x64-setup.exe".
          find downloaded/cpi-workbench-* -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.rpm' \) \
            -exec sh -c 'cp "$1" "assets/$(basename "$1" | tr " " "-")"' _ {} \;
          for jar in downloaded/engine-jars/*/target/*.jar; do
            name="$(basename "$jar" .jar)"
            cp "$jar" "assets/$name-$VERSION.jar"
          done
          (cd assets && sha256sum * > SHA256SUMS.txt)
          ls -la assets
          for kind in msi exe dmg deb rpm jar; do
            ls assets/*."$kind" >/dev/null 2>&1 || { echo "::error::no .$kind file to release"; exit 1; }
          done
      - name: Release notes
        run: |
          # The CHANGELOG section of this version, then the install notes.
          awk -v head="## [$VERSION]" 'index($0, head) == 1 {on=1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section '## [$VERSION]'"
            exit 1
          fi
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs/install.md"
          {
            echo
            echo "## Install"
            echo
            echo "| System | File |"
            echo "|---|---|"
            echo "| Windows 10/11 (x64) | \`CPI-Workbench_${VERSION}_x64-setup.exe\` (per user, no admin rights) or the \`.msi\` |"
            echo "| macOS 11+ (Apple Silicon) | \`CPI-Workbench_${VERSION}_aarch64.dmg\` |"
            echo "| Linux x64 | \`.deb\` (Ubuntu 22.04+, Debian 12+) or \`.rpm\` (Fedora) |"
            echo "| Command line, any OS with Java 17+ | \`cpiwb-*-${VERSION}.jar\` |"
            echo
            echo "The installers are not code-signed yet, so Windows and macOS warn on the first start."
            echo "See [installing CPI Workbench]($url) for the steps. Checksums: \`SHA256SUMS.txt\`."
          } >> notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""; case "$VERSION" in *-*) pre="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" assets/* --title "CPI Workbench $VERSION" --notes-file notes.md --verify-tag $pre
